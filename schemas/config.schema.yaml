$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: SingleStore connection settings
additionalProperties: false
required:
- prebuilt
- host
- port
- database
- user
properties:
  prebuilt:
    type: string
    enum:
    - singlestore
    title: SQL interface
    default: singlestore
    description: SingleStore SQL interface; this extension cannot select another database.
    const: singlestore
    readOnly: true
  host:
    type: string
    title: Host
    description: SingleStore host.
  port:
    type: string
    title: Port
    description: SingleStore port.
  database:
    type: string
    title: Database
    description: SingleStore database.
  user:
    type: string
    title: User
    description: SingleStore user.
  env:
    type: object
    title: Advanced SingleStore environment
    additionalProperties: false
    properties:
      SINGLESTORE_HOST:
        type: string
      SINGLESTORE_PORT:
        type: string
      SINGLESTORE_DATABASE:
        type: string
      SINGLESTORE_USER:
        type: string
    description: Optional SingleStore source environment overrides only. Credentials belong in secrets.
