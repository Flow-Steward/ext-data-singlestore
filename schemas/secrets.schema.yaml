$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: SingleStore credentials
additionalProperties: false
properties:
  password:
    type: string
    title: SingleStore password
    description: Password for the selected SingleStore user.
    minLength: 1
  env:
    type: object
    title: Advanced SingleStore secret environment
    additionalProperties: false
    properties:
      SINGLESTORE_PASSWORD:
        type: string
        minLength: 1
    description: Optional SingleStore password environment override.
anyOf:
- required:
  - password
- required:
  - env
  properties:
    env:
      required:
      - SINGLESTORE_PASSWORD
